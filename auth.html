<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Login Gateway — My Financial Plan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/brand/brand_logo.png">
<style>
  :root {
    --ink: #17324A;
    --ink2: #44586E;
    --teal: #0E9D78;
    --teal-dark: #075E46;
    --indigo: #4C62CE;
    --bg: #0F172A;
    --card: #FFFFFF;
    --line: #E2E8F0;
    --mint: #DDF4EC;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0F172A 0%, #1E293B 55%, #0F172A 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--ink);
  }
  .wrap { width: 100%; max-width: 480px; }
  .brand { text-align: center; margin-bottom: 24px; }
  .brand img { height: 44px; }
  .brand h2 { color: #FFFFFF; font-size: 22px; font-weight: 900; margin-top: 8px; }
  .brand p { color: #94A3B8; font-size: 13px; margin-top: 4px; }
  
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    border: 1.5px solid #BCE5D9;
  }

  /* Mode Switcher Pills */
  .mode-switcher {
    display: flex;
    background: #F1F5F9;
    border-radius: 16px;
    padding: 4px;
    margin-bottom: 24px;
    gap: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 12px;
    border: none;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--ink2);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .mode-btn.active-ind {
    background: var(--teal);
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(14,157,120,0.3);
  }
  .mode-btn.active-part {
    background: var(--indigo);
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(76,98,206,0.3);
  }

  /* Form Elements */
  label { display: block; font-size: 12px; font-weight: 800; color: var(--ink2); letter-spacing: 0.05em; margin-bottom: 6px; text-transform: uppercase; }
  input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    outline: none;
    margin-bottom: 16px;
    transition: border 0.2s ease;
  }
  input:focus { border-color: var(--teal); }

  .btn {
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
  }
  .btn-ind { background: linear-gradient(135deg, #0E9D78, #0B8465); color: #FFFFFF; box-shadow: 0 6px 18px rgba(14,157,120,0.3); }
  .btn-part { background: linear-gradient(135deg, #4C62CE, #3A4DB0); color: #FFFFFF; box-shadow: 0 6px 18px rgba(76,98,206,0.3); }
  .btn-google { background: #FFFFFF; border: 1.5px solid var(--line); color: var(--ink); margin-top: 12px; }
  
  .divider { text-align: center; margin: 18px 0; font-size: 12px; color: #94A3B8; font-weight: 700; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--line); }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  
  .footer-note { text-align: center; margin-top: 18px; font-size: 12px; color: #94A3B8; }
  .footer-note a { color: #5FE3B8; text-decoration: none; font-weight: 700; }
</style>
  <script src="/assets/js/mfp-protect.js" defer></script>
<style id="mfp-responsive-fit">
/* MFP responsive + layout fit — measurements and reasoning for every rule
   are in sitegen/apply-responsive-fix.mjs and RESPONSIVE_UI_AUDIT.html */
nav.top .logo{width:auto;max-width:none;flex:0 0 auto;object-fit:contain}
/* MEASURED at 390px: a correctly-proportioned logo (168px) + the हिंदी switch */
@media (max-width:620px){
  nav.top .wrap{height:auto;min-height:64px;flex-wrap:wrap;padding:8px 14px;gap:8px}
  nav.top .logo{height:30px}
  #langSw{display:flex;align-items:center;height:32px;padding:0 12px;font-size:11.5px;margin-right:0}
  nav.top a.btn{display:flex;align-items:center;justify-content:center;height:40px;
                padding:0 12px;font-size:12.5px;margin-left:0!important}
  .burger{width:40px;height:40px;margin-left:0}
}
@media (max-width:360px){
  nav.top .logo{height:26px}
  #langSw{font-size:11px;padding:0 10px}
}
.top .wrap{flex-wrap:wrap;row-gap:6px}
.top .wrap>nav{min-width:0;flex-wrap:wrap}
@media (max-width:560px){
  .top .wrap{padding:10px 14px}
  .top .wrap>a:first-child{flex:0 0 auto}
  a.hot{margin-left:auto}
  .rel{gap:8px}
  .rel a{flex:0 1 auto;min-width:0}
}
img,svg,video,canvas{max-width:100%}
/* The footer logo carries style="height:84px;max-width:88vw" inline. On a phone */
@media (max-width:620px){
  img[src*="brand_logo_light"]{height:auto!important;width:auto!important;max-width:min(88vw,470px)!important}
}
@media (max-width:620px){
  /* grid tracks: a 1fr column still refuses to shrink below its content's */
  .grid2,.grid3,.cardgrid,.cards{grid-template-columns:1fr!important}
  .grid2>*,.grid3>*,.cardgrid>*,.cards>*{min-width:0}
  input,select,textarea{min-width:0;max-width:100%}
  /* a scenario table 2px wider than the screen: let it scroll inside itself */
  .gc-scen{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* nowrap buttons 10px over the edge */
  .btn-estate{white-space:normal;max-width:100%}
  /* the vanshavali page renders a 281px-wide brand logo plus its broken-image */
  .mfp-brand-group{max-width:100%;flex-wrap:wrap}
  .mfp-brand-logo,.mfp-brand-group svg{max-width:100%;height:auto;width:auto}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <a href="./index.html"><img src="assets/brand/brand_logo.png" alt="My Financial Plan"></a>
    <h2>Single Unified Login Gateway</h2>
    <p>Access Individual Client Dashboard or Dedicated Partner Portal</p>
  </div>

  <div class="card">
    <!-- Mode Switcher Tabs -->
    <div class="mode-switcher">
      <button id="btn-mode-ind" class="mode-btn active-ind" onclick="switchMode('individual')">
        <span>👤</span> Individual Mode
      </button>
      <button id="btn-mode-part" class="mode-btn" onclick="switchMode('partner')">
        <span>🤝</span> Partner Mode
      </button>
    </div>

    <!-- Mode Subtitle -->
    <p id="mode-subtitle" style="font-size:13px; color:var(--ink2); text-align:center; margin-bottom:18px; font-weight:600;">
      Personal Family Financial Planning & App Access
    </p>

    <!-- Unified Phone / OTP Login Form -->
    <div id="phone-login-sec">
      <label for="userPhone">Mobile Number (WhatsApp Enabled)</label>
      <input type="tel" id="userPhone" placeholder="+91 98765 43210" value="+91 ">

      <div id="otp-field" style="display:none;">
        <label for="userOtp">Enter 6-Digit OTP</label>
        <input type="number" id="userOtp" placeholder="123456" maxlength="6">
      </div>

      <button id="submit-auth-btn" class="btn btn-ind" onclick="handleAuthSubmit()">
        📱 Get Verification OTP
      </button>
    </div>

    <div class="divider">OR SIGN IN WITH</div>

    <!-- Google OAuth Button -->
    <button class="btn btn-google" onclick="handleGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <!-- Activation Key Section -->
    <div style="margin-top:18px; padding-top:14px; border-top:1px dashed var(--line); text-align:center;">
      <a href="javascript:void(0)" onclick="toggleKeyBox()" style="font-size:12px; font-weight:800; color:var(--teal); text-decoration:none;">
        🔑 Have an Activation Key? (Silver / Gold / Platinum)
      </a>
      <div id="key-box" style="display:none; margin-top:12px;">
        <input type="text" id="activationKey" placeholder="MFP-G030-XXXX-YYYY" style="text-transform:uppercase; margin-bottom:10px;">
        <button class="btn btn-ind" style="font-size:13px; padding:10px;" onclick="redeemActivationKey()">Redeem Key</button>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <a href="./index.html">← Back to Home Page</a>
  </div>
</div>

<script>
  let currentMode = 'individual';
  let otpSent = false;

  function switchMode(mode) {
    currentMode = mode;
    const btnInd = document.getElementById('btn-mode-ind');
    const btnPart = document.getElementById('btn-mode-part');
    const subtitle = document.getElementById('mode-subtitle');
    const submitBtn = document.getElementById('submit-auth-btn');

    if (mode === 'individual') {
      btnInd.className = 'mode-btn active-ind';
      btnPart.className = 'mode-btn';
      subtitle.textContent = 'Personal Family Financial Planning & App Access';
      submitBtn.className = 'btn btn-ind';
    } else {
      btnPart.className = 'mode-btn active-part';
      btnInd.className = 'mode-btn';
      subtitle.textContent = 'Advisor Workspace, Client Management & CRM Access';
      submitBtn.className = 'btn btn-part';
    }
  }

  function handleAuthSubmit() {
    const phone = document.getElementById('userPhone').value.trim();
    if (phone.length < 10) {
      alert('Please enter a valid 10-digit mobile number.');
      return;
    }

    if (!otpSent) {
      otpSent = true;
      document.getElementById('otp-field').style.display = 'block';
      document.getElementById('submit-auth-btn').textContent = '✅ Verify OTP & Sign In';
      alert('Verification OTP sent to ' + phone + ' (Demo OTP: 123456)');
    } else {
      completeLogin(phone);
    }
  }

  function handleGoogleSignIn() {
    alert('Signing in with Google Account...');
    completeLogin('Google Authenticated User');
  }

  function redeemActivationKey() {
    const key = document.getElementById('activationKey').value.trim();
    if (!key) {
      alert('Please enter your activation key.');
      return;
    }
    alert('Activation key ' + key + ' confirmed!');
    completeLogin('Key User - ' + key);
  }

  function toggleKeyBox() {
    const kb = document.getElementById('key-box');
    kb.style.display = (kb.style.display === 'none') ? 'block' : 'none';
  }

  function completeLogin(identifier) {
    const authState = {
      isLoggedIn: true,
      mode: currentMode,
      identifier: identifier,
      loginTime: new Date().toISOString()
    };

    localStorage.setItem('MFP_AUTH_STATE', JSON.stringify(authState));
    sessionStorage.setItem('MFP_USER_MODE', currentMode);

    if (currentMode === 'individual') {
      window.location.href = './app/index.html';
    } else {
      window.location.href = './app/index.html#partner';
    }
  }

  // Pre-select mode if URL contains hashtag
  if (window.location.hash === '#partner') {
    switchMode('partner');
  } else {
    switchMode('individual');
  }
</script>

</body>
</html>
