    // v2.17.4 — SELF-HEALING stale-cache killer (APP-UX-CHANGELOG B3): har
    // deploy ke baad app KHUD purana service-worker cache saaf karke naya
    // version reload karti hai — koi user kabhi purane version par na phanse.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var KEY = 'app_build_seen', FLAG = 'sw_nuke_once';
      fetch('version.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j || !j.build_number) return;
          var build = String(j.build_number);
          var seen = localStorage.getItem(KEY);
          if (seen === build) return;                    // same build — sab theek
          var controlled = !!navigator.serviceWorker.controller;
          localStorage.setItem(KEY, build);
          if ((seen === null && !controlled) || sessionStorage.getItem(FLAG)) return;
          sessionStorage.setItem(FLAG, '1');             // session mein ek hi baar reload
          return navigator.serviceWorker.getRegistrations()
            .then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            })
            .then(function () { return caches.keys(); })
            .then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            })
            .then(function () { location.reload(); });
        })
        .catch(function () { /* offline — app chalti rahe */ });
    })();
  </script>
