  <!-- Google Identity Services (GIS) for One-Tap Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.mfpGoogleSignIn = function(clientId) {
      var activeClientId = clientId || "548984348697-i4d6j8842bk8va0i2rqvehvl1pjjfm7a.apps.googleusercontent.com";
      console.log("mfpGoogleSignIn invoked with clientId:", activeClientId);

      return new Promise(function(resolve) {
        var done = false;
        function fin(tokenVal) {
          if (done) return;
          done = true;
          resolve(tokenVal || "");
        }

        try {
          if (!window.google || !google.accounts || !google.accounts.id) {
            console.warn("Google Identity Services SDK not loaded yet");
            fin("");
            return;
          }

          google.accounts.id.initialize({
            client_id: activeClientId,
            callback: function(response) {
              if (response && response.credential) {
                console.log("Google Sign-In credential received successfully!");
                fin(response.credential);
              } else {
                console.warn("Google Sign-In response missing credential");
                fin("");
              }
            },
            auto_select: false,
            cancel_on_tap_outside: true
          });

          google.accounts.id.prompt(function(notification) {
            if (notification.isSkippedMoment && notification.isSkippedMoment()) {
              console.warn("Google One-Tap prompt skipped:", notification.getSkippedReason());
            }
            if (notification.isDismissedMoment && notification.isDismissedMoment()) {
              console.warn("Google One-Tap prompt dismissed:", notification.getDismissedReason());
            }
          });
        } catch(err) {
          console.error("Error during Google Authentication:", err);
          fin("");
        }

        setTimeout(function() {
          if (!done) {
            console.warn("Google Authentication timed out after 90 seconds");
            fin("");
          }
        }, 90000);
      });
    };
  </script>

  <div id="loading-indicator" style="position: fixed; inset: 0; background: #081028; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: system-ui, -apple-system, sans-serif; transition: opacity 0.4s ease;">
    <div style="width: 52px; height: 52px; border: 4px solid rgba(251, 191, 36, 0.2); border-top-color: #FBBF24; border-radius: 50%; animation: mfp-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
    <div style="color: #FFFFFF; font-size: 18px; font-weight: 700; letter-spacing: 0.5px;">MyFinancialPlan</div>
    <div id="loading-status-text" style="color: #94A3B8; font-size: 13px; margin-top: 6px;">Loading full financial application...</div>
  </div>

  <script>
    (function() {
      function dismissLoader() {
        var loader = document.getElementById("loading-indicator");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(function() {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 400);
        }
      }

      window.addEventListener("flutter-first-frame", dismissLoader);

      var obs = new MutationObserver(function() {
        if (document.querySelector("flt-glass-pane, flutter-view, canvas, flt-scene-host")) {
          setTimeout(dismissLoader, 200);
          obs.disconnect();
        }
      });
      obs.observe(document.body || document.documentElement, { childList: true, subtree: true });

      setTimeout(function() {
        var st = document.getElementById("loading-status-text");
        if (st) st.innerText = "Initializing 500+ financial calculators...";
      }, 3000);

      setTimeout(dismissLoader, 15000);
    })();
  </script>
