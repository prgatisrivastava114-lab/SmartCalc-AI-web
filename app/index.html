  <script>
    // v2.17.4 — SELF-HEALING stale-cache killer (APP-UX-CHANGELOG B3): har
    // deploy ke baad app KHUD purana service-worker cache saaf karke naya
    // version reload karti hai — koi user kabhi purane version par na phanse.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var KEY = 'app_build_seen', FLAG = 'sw_nuke_once';
      fetch('version.json?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j || !j.build_number) return;
          var build = String(j.build_number);
          var seen = localStorage.getItem(KEY);
          if (seen === build) return;                    // same build — sab theek
          var controlled = !!navigator.serviceWorker.controller;
          localStorage.setItem(KEY, build);
          if ((seen === null && !controlled) || sessionStorage.getItem(FLAG)) return;
          sessionStorage.setItem(FLAG, '1');             // session mein ek hi baar reload
          return navigator.serviceWorker.getRegistrations()
            .then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            })
            .then(function () { return caches.keys(); })
            .then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            })
            .then(function () { location.reload(); });
        })
        .catch(function () { /* offline — app chalti rahe */ });
    })();
  </script>

  <!-- v3.0 P1 — Google Identity Services bridge: One-Tap sign-in hands the
       Google ID token (JWT) to Flutter, which converts it into a Firebase
       session over REST (zero pub packages). Client ID injected by Dart. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
  /* v2.27 auth repair — Google GIS/FedCM is loaded asynchronously and current
     Chrome no longer guarantees the old One-Tap moment callbacks. Wait for
     GIS, remove deprecated isSkipped/isDismissed handling, and render a real
     Google button as a visible fallback whenever One-Tap is suppressed. */
  window.mfpGoogleSignIn=function(clientId){return new Promise(function(resolve){
    var done=false, timer=null, waitTimer=null;
    function overlay(){
      var el=document.getElementById('mfpGoogleButton');
      if(!el){
        el=document.createElement('div'); el.id='mfpGoogleButton';
        el.style.cssText='position:fixed;z-index:2147483647;left:50%;bottom:24px;transform:translateX(-50%);padding:12px;background:#fff;border:1px solid #DCE8EF;border-radius:16px;box-shadow:0 12px 36px rgba(23,50,74,.25);display:block;';
        document.body.appendChild(el);
      }
      el.style.display='block'; return el;
    }
    function hide(){var el=document.getElementById('mfpGoogleButton');if(el){el.style.display='none';el.innerHTML='';}}
    function fin(v){if(done)return;done=true;if(timer)clearTimeout(timer);if(waitTimer)clearTimeout(waitTimer);hide();resolve(v||'');}
    function start(){
      try{
        if(!window.google||!google.accounts||!google.accounts.id){fin('');return;}
        google.accounts.id.initialize({client_id:clientId,callback:function(r){fin(r&&r.credential?r.credential:'');},auto_select:false,cancel_on_tap_outside:false});
        var el=overlay();
        google.accounts.id.renderButton(el,{theme:'outline',size:'large',width:300,text:'continue_with',shape:'pill'});
        google.accounts.id.prompt();
        timer=setTimeout(function(){fin('');},30000);
      }catch(e){fin('');}
    }
    var tries=0;
    function wait(){
      if(window.google&&google.accounts&&google.accounts.id){start();return;}
      if(++tries>120){fin('');return;}
      waitTimer=setTimeout(wait,100);
    }
    wait();
  });};
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

  <script src="https://checkout.razorpay.com/v1/checkout.js" async defer></script>
  <script>
    /* Razorpay web checkout bridge for PaymentService (launch Phase-1).
       Opens the standard checkout and resolves {paymentId} on success,
       null when the buyer dismisses it. Key id comes from the Owner Panel
       flag (razorpay_key_id) at runtime — never hard-coded here. */
    window.mfpRzpOpen=function(o){return new Promise(function(resolve,reject){
      try{
        if(typeof Razorpay==='undefined'){reject(new Error('rzp-sdk-missing'));return;}
        var r=new Razorpay({
          key:o.keyId, amount:o.amountPaise, currency:'INR',
          name:o.name||'SmartCalc Partner', description:o.description||'',
          prefill:{email:o.email||''},
          theme:{color:'#0E9D78'},
          handler:function(resp){resolve({paymentId:(resp&&resp.razorpay_payment_id)||''});},
          modal:{ondismiss:function(){resolve(null);}}
        });
        r.on('payment.failed',function(e){reject(new Error((e&&e.error&&e.error.description)||'payment-failed'));});
        r.open();
      }catch(err){reject(err);}
    });};
  </script>
  <script src="flutter_bootstrap.js" async></script>
